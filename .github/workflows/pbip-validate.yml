name: PBIP & Semantic Model Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Verify PBIR Schema, TMDL Model & E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Verify PBIR report layout & theme integrity
        run: python scripts/verify_report.py

      - name: Validate TMDL model, M staging & visual budgets
        run: python scripts/validate_model_mcp.py

      - name: Run 5-tier E2E regression suite
        run: python tests/run_e2e_tests.py

      - name: Run full pytest suite (including adversarial mutations)
        run: python -m pytest tests/ -q
